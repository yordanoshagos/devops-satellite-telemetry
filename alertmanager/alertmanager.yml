
global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: ["alertname", "service"]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h
  routes:
    - receiver: slack
      matchers:
        - severity=~"warning|critical"

receivers:
  - name: default

  - name: slack
    slack_configs:
      - api_url: "__SLACK_WEBHOOK_URL__"
        channel: "__SLACK_CHANNEL__"
        send_resolved: true
        username: "alertmanager"
        title: "[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}"
        text: >-
          {{ range .Alerts }}
          *Service:* {{ .Labels.service }}\n
          *Severity:* {{ .Labels.severity }}\n
          *Summary:* {{ .Annotations.summary }}\n
          *Details:* {{ .Annotations.description }}\n
          {{ end }}

inhibit_rules:
  # If a service is fully down, silence its (redundant) error/latency alerts.
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: ["service"]
