
global:
  resolve_timeout: 5m
  smtp_smarthost: "__SMTP_SMARTHOST__"
  smtp_from: "__SMTP_FROM__"
  smtp_auth_username: "__SMTP_AUTH_USERNAME__"
  smtp_auth_password: "__SMTP_AUTH_PASSWORD__"
  smtp_require_tls: __SMTP_REQUIRE_TLS__

route:
  receiver: default
  group_by: ["alertname", "service"]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h
  routes:
    - receiver: slack-and-email
      matchers:
        - severity=~"warning|critical"

receivers:
  - name: default

  - name: slack
    slack_configs:
      - api_url: "__SLACK_WEBHOOK_URL__"
        channel: "__SLACK_CHANNEL__"
        send_resolved: true
        username: "alertmanager"
        title: "[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}"
        text: >-
          {{ range .Alerts }}
          *Service:* {{ .Labels.service }}\n
          *Severity:* {{ .Labels.severity }}\n
          *Summary:* {{ .Annotations.summary }}\n
          *Details:* {{ .Annotations.description }}\n
          {{ end }}

  - name: slack-and-email
    slack_configs:
      - api_url: "__SLACK_WEBHOOK_URL__"
        channel: "__SLACK_CHANNEL__"
        send_resolved: true
        username: "alertmanager"
        title: "[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}"
        text: >-
          {{ range .Alerts }}
          *Service:* {{ .Labels.service }}\n
          *Severity:* {{ .Labels.severity }}\n
          *Summary:* {{ .Annotations.summary }}\n
          *Details:* {{ .Annotations.description }}\n
          {{ end }}
    email_configs:
      - to: "__ALERT_EMAIL_TO__"
        send_resolved: true
        headers:
          subject: "[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})"
        html: |
          <h3>Satellite Telemetry Alert</h3>
          <p><b>Status:</b> {{ .Status | toUpper }}</p>
          {{ range .Alerts }}
          <p>
            <b>Service:</b> {{ .Labels.service }}<br/>
            <b>Severity:</b> {{ .Labels.severity }}<br/>
            <b>Summary:</b> {{ .Annotations.summary }}<br/>
            <b>Details:</b> {{ .Annotations.description }}
          </p>
          {{ end }}

inhibit_rules:
  # If a service is fully down, silence its (redundant) error/latency alerts.
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: ["service"]
